name: Build and release XMW offline deployment

on:
  push:
    branches: ['release/22.7-xmw']
    tags: ['[0-9]*', '!*-xmw-*']
  pull_request:
    branches: ['release/22.7-xmw']
    paths:
      - '.github/workflows/release-xmw.yml'
      - 'scripts/release/**'
  workflow_dispatch:

concurrency:
  group: xmw-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test release ref handling and publication failures
        run: |
          bash -n scripts/release/prepare-release.sh scripts/release/publish-release.sh scripts/release/test-prepare-release.sh
          bash scripts/release/test-prepare-release.sh
          python3 scripts/release/test-publish-release.py

  prepare:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/release/22.7-xmw' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      create_tag: ${{ steps.release.outputs.create_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve release tag and source
        id: release
        run: bash scripts/release/prepare-release.sh

  package:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Docker 29.1.3 storage backend
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          version: '29.1.3'
          daemon-config: |
            {"features":{"containerd-snapshotter":${{ matrix.store == 'containerd' }}}}
      - name: Test archive identity binding
        run: python3 scripts/release/test-archive-identity.py
      - name: Test Compose command compatibility
        run: bash scripts/release/test-compose.sh
      - name: Build offline bundle
        run: bash scripts/release/build-xmw.sh
      - name: Test actual exported images and persistence
        run: bash scripts/release/smoke-xmw.sh dist/zentao-*-linux-amd64-offline.tar.gz
      - if: matrix.store == 'classic'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xmw-offline
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a # v4.3.0
        with:
          name: xmw-offline
          path: dist
      - name: Publish tested release (replace on rerun)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
        shell: bash
        run: bash scripts/release/publish-release.sh
